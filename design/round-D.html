<script type="text/x-dc" data-dc-script="" data-props="{&quot;hour&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:0,&quot;max&quot;:23,&quot;section&quot;:&quot;Time&quot;},&quot;minute&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:47,&quot;min&quot;:0,&quot;max&quot;:59,&quot;section&quot;:&quot;Time&quot;},&quot;weekday&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;MON&quot;,&quot;TUE&quot;,&quot;WED&quot;,&quot;THU&quot;,&quot;FRI&quot;,&quot;SAT&quot;,&quot;SUN&quot;],&quot;default&quot;:&quot;TUE&quot;,&quot;section&quot;:&quot;Date&quot;},&quot;day&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:13,&quot;min&quot;:1,&quot;max&quot;:31,&quot;section&quot;:&quot;Date&quot;},&quot;battery&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:72,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Status&quot;},&quot;btDisconnected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Status&quot;},&quot;quietTime&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Status&quot;},&quot;sunrise&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;06:31&quot;,&quot;section&quot;:&quot;Sun&quot;},&quot;sunset&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;19:43&quot;,&quot;section&quot;:&quot;Sun&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;black&quot;,&quot;teal&quot;],&quot;default&quot;:&quot;black&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;countdownAt&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;card&quot;,&quot;start&quot;,&quot;end&quot;],&quot;default&quot;:&quot;card&quot;,&quot;section&quot;:&quot;Next event&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFAA00&quot;,&quot;options&quot;:[&quot;#FFAA00&quot;,&quot;#00AAFF&quot;,&quot;#FF5555&quot;,&quot;#55FFAA&quot;]},&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:600}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const bool = (v, d) => (v === undefined || v === null) ? d : (v === true || v === 'true');
    const num = (v, d, lo, hi) => { const n = Number(v ?? d); return Math.min(hi, Math.max(lo, isNaN(n) ? d : n)); };
    const hm = (s, d) => { const m = String(s ?? '').match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1]) + Number(m[2]) / 60 : d; };
    const hour = num(p.hour, 14, 0, 23);
    const minute = num(p.minute, 47, 0, 59);
    const battery = Math.round(num(p.battery, 72, 0, 100));
    const btOff = bool(p.btDisconnected, true);
    const quiet = bool(p.quietTime, true);
    const sunrise = hm(p.sunrise, 6.52), sunset = hm(p.sunset, 19.72);

    const C = 130, S = 560 / 300;
    const f = (n) => Math.round(n * 100) / 100;
    const rad = (d) => d * Math.PI / 180;
    const pt = (r, d) => [f(C + r * Math.sin(rad(d))), f(C - r * Math.cos(rad(d)))];
    const px = (r, d) => { const [x, y] = pt(r, d); return { l: f(20 + (x + 20) * S), t: f(20 + (y + 20) * S) }; };
    const arc = (r1, r2, a, b) => {
      const L = (b - a) > 180 ? 1 : 0;
      const [x1, y1] = pt(r2, a), [x2, y2] = pt(r2, b), [x3, y3] = pt(r1, b), [x4, y4] = pt(r1, a);
      return 'M' + x1 + ' ' + y1 + 'A' + r2 + ' ' + r2 + ' 0 ' + L + ' 1 ' + x2 + ' ' + y2 + 'L' + x3 + ' ' + y3 + 'A' + r1 + ' ' + r1 + ' 0 ' + L + ' 0 ' + x4 + ' ' + y4 + 'Z';
    };
    const ticks = (r1, r2, list) => list.map((d) => { const [a, b] = pt(r1, d), [c, e] = pt(r2, d); return 'M' + a + ' ' + b + 'L' + c + ' ' + e; }).join('');
    const angDist = (a, b) => { const d = ((a - b) % 360 + 360) % 360; return Math.min(d, 360 - d); };
    const clock = (h) => String(Math.floor(h) % 24).padStart(2, '0') + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0');

    const now = hour + minute / 60;
    const hA = (now % 12) * 30;
    const mA = minute * 6;
    const clear = (a) => Math.min(angDist(a, hA), angDist(a, mA));

    // Sample calendar (decimal hours; Google Calendar colours mapped to the Pebble 64-colour palette)
    const EVENTS = [
      { s: 15.5, e: 16, c: '#00AAFF', t: 'Standup' },
      { s: 17, e: 18.5, c: '#55AA55', t: 'Design review' },
      { s: 19.25, e: 20, c: '#FF5500', t: 'Dinner' },
      { s: 21.5, e: 22, c: '#AA00AA', t: 'Call' },
      { s: 33, e: 34, c: '#0055AA', t: 'Gym' }
    ];
    const vis = EVENTS.map((e) => ({ ...e, s0: Math.max(e.s, now), e0: Math.min(e.e, now + 12) })).filter((e) => e.e0 > e.s0);
    const ev = [0, 1, 2, 3, 4].map((i) => {
      const e = vis[i];
      if (!e) return { d: '', c: 'none' };
      const a = e.s0 * 30, b = Math.max(a + 1, e.e0 * 30 - 1);
      return { d: arc(119, 129, a, b), c: e.c };
    });
    const nx = vis.find((e) => e.s >= now);
    const countdownAt = ['start', 'end'].includes(p.countdownAt) ? p.countdownAt : 'card';
    let nextTri = '', nextC = 'none', sweep = '', chevron = '', nextTime = '', nextIn = '', nextTitle = '', nextShort = '', cdAngle = 0;
    if (nx) {
      const a = nx.s * 30;
      const [tx, ty] = pt(118, a), [b1x, b1y] = pt(109, a - 4), [b2x, b2y] = pt(109, a + 4);
      nextTri = 'M' + tx + ' ' + ty + 'L' + b1x + ' ' + b1y + 'L' + b2x + ' ' + b2y + 'Z';
      nextC = nx.c;
      const a0 = now * 30;
      if (a - a0 > 5) {
        // Chevron at now, pointing clockwise; the line starts from its point
        sweep = arc(123, 125.5, a0 + 3.5, a - 0.5);
        const [c1x, c1y] = pt(119.5, a0), [c2x, c2y] = pt(124.25, a0 + 3.5), [c3x, c3y] = pt(129, a0);
        chevron = 'M' + c1x + ' ' + c1y + 'L' + c2x + ' ' + c2y + 'L' + c3x + ' ' + c3y;
      }
      cdAngle = countdownAt === 'end' ? a - 11 : a0 + 9;
      nextTime = clock(nx.s);
      const dm = Math.round((nx.s - now) * 60);
      nextIn = dm < 60 ? 'in ' + dm + 'm' : 'in ' + Math.floor(dm / 60) + 'h ' + (dm % 60) + 'm';
      nextShort = dm < 60 ? dm + 'm' : Math.floor(dm / 60) + 'h' + String(dm % 60).padStart(2, '0');
      nextTitle = nx.t;
    }

    const all = Array.from({ length: 60 }, (_, i) => i * 6);
    const minTicks = ticks(122, 129, all.filter((d) => d % 30 !== 0));
    const hourTicks = ticks(111, 129, all.filter((d) => d % 30 === 0 && d % 90 !== 0));
    const quarterTicks = ticks(103, 129, [0, 90, 180, 270]);

    // Sunrise / sunset: short coloured ticks just inside the event ring
    const rA = (sunrise % 12) * 30, sA = (sunset % 12) * 30;
    // Icons sit with the sun's flat edge on the screen edge (r 130), sun towards the centre,
    // so the dial edge reads as the horizon (upright in the bottom half, where sunrise/sunset usually fall)

    // Dodge: score 8 slots by clearance from both hands; cardinals get a small bonus
    const cands = [0, 45, 90, 135, 180, 225, 270, 315].map((a) => ({ a, s: clear(a) + (a % 90 === 0 ? 8 : 0) }));
    const sorted = [...cands].sort((x, y) => y.s - x.s);
    const s1 = sorted[0];
    const s2 = sorted.find((c) => angDist(c.a, s1.a) >= 90) || sorted[1];
    const dateSlot = s1, cardSlot = s2;

    // Status icons just outboard of the date
    const active = [btOff ? 'bt' : null, quiet ? 'qt' : null].filter(Boolean);
    const pos = {};
    active.forEach((k, i) => {
      const off = active.length === 2 ? (i === 0 ? -8 : 8) : 0;
      pos[k] = px(95, dateSlot.a + off);
    });

    // Battery ring sits under the hands; its number orbits inside the ring, away from both hands
    let best = 0, bestS = -1;
    for (let a = 0; a < 360; a += 5) { const s = clear(a); if (s > bestS) { bestS = s; best = a; } }
    const Cc = 2 * Math.PI * 27;
    const batC = battery <= 15 ? '#FF5555' : battery <= 30 ? '#FFAA00' : '#55AA55';
    // Physical hands: tapered, running through the centre into a short tail
    const hand = (ang, tail, len, wBase, wTip) => {
      const cs = Math.cos(rad(ang)), sn = Math.sin(rad(ang));
      const P = (r, w) => f(C + r * sn + w * cs) + ' ' + f(C - r * cs + w * sn);
      return 'M' + P(-tail, -wBase * 0.35) + 'L' + P(0, -wBase / 2) + 'L' + P(len, -wTip / 2) + 'L' + P(len + wTip * 0.6, 0) + 'L' + P(len, wTip / 2) + 'L' + P(0, wBase / 2) + 'L' + P(-tail, wBase * 0.35) + 'Z';
    };
    const hrPath = hand(hA, 17, 66, 9, 5);
    const mnPath = hand(mA, 23, 108, 7, 3.4);
    const th = p.theme === 'teal'
      ? { dial: '#005555', tick: '#FFFFAA', minTick: '#55AAAA', track: '#000000', shadow: '#000000' }
      : { dial: '#000000', tick: '#FFFFFF', minTick: '#555555', track: '#555555', shadow: '#000000' };

    return {
      accent: p.accent ?? '#FFAA00',
      weekday: p.weekday ?? 'TUE',
      day: p.day ?? 13,
      battery, batC, batDash: f(Cc * battery / 100) + ' ' + f(Cc),
      batNum: px(15, best),
      ev0: ev[0], ev1: ev[1], ev2: ev[2], ev3: ev[3], ev4: ev[4],
      sweep, chevron, nextTri, nextC, nextTime, nextIn, nextTitle, nextShort, hasNext: !!nx,
      inCard: countdownAt === 'card', onRing: !!nx && countdownAt !== 'card',
      cd: px(countdownAt === 'end' ? 101 : 104, cdAngle),
      cdColor: countdownAt === 'end' ? '#FFFFFF' : '#AAAAAA',
      minTicks, hourTicks, quarterTicks,
      riseP: px(126, rA), setP: px(126, sA), riseC: px(115, rA), setC: px(115, sA), riseRot: f(rA - 180), setRot: f(sA - 180),
      date: px(66, dateSlot.a),
      card: px(68, cardSlot.a),
      btOff, quiet,
      bt: pos.bt || { l: 0, t: 0 }, qt: pos.qt || { l: 0, t: 0 },
      hrPath, mnPath, th
    };
  }
}
