<script type="text/x-dc" data-dc-script="" data-props="{&quot;hour&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:0,&quot;max&quot;:23,&quot;section&quot;:&quot;Time&quot;},&quot;minute&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:47,&quot;min&quot;:0,&quot;max&quot;:59,&quot;section&quot;:&quot;Time&quot;},&quot;weekday&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;MON&quot;,&quot;TUE&quot;,&quot;WED&quot;,&quot;THU&quot;,&quot;FRI&quot;,&quot;SAT&quot;,&quot;SUN&quot;],&quot;default&quot;:&quot;WED&quot;,&quot;section&quot;:&quot;Date&quot;},&quot;day&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:1,&quot;max&quot;:31,&quot;section&quot;:&quot;Date&quot;},&quot;battery&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:72,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Status&quot;},&quot;btDisconnected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Status&quot;},&quot;quietTime&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Status&quot;},&quot;sunrise&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;06:31&quot;,&quot;section&quot;:&quot;Sun&quot;},&quot;sunset&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;19:43&quot;,&quot;section&quot;:&quot;Sun&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;black&quot;,&quot;teal&quot;],&quot;default&quot;:&quot;black&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;handReach&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fixed&quot;,&quot;stretch&quot;],&quot;default&quot;:&quot;fixed&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFAA00&quot;,&quot;options&quot;:[&quot;#FFAA00&quot;,&quot;#00AAFF&quot;,&quot;#FF5555&quot;,&quot;#55FFAA&quot;]},&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:700}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const bool = (v, d) => (v === undefined || v === null) ? d : (v === true || v === 'true');
    const num = (v, d, lo, hi) => { const n = Number(v ?? d); return Math.min(hi, Math.max(lo, isNaN(n) ? d : n)); };
    const hm = (s, d) => { const m = String(s ?? '').match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1]) + Number(m[2]) / 60 : d; };
    const hour = num(p.hour, 14, 0, 23);
    const minute = num(p.minute, 47, 0, 59);
    const battery = Math.round(num(p.battery, 72, 0, 100));
    const btOff = bool(p.btDisconnected, true);
    const quiet = bool(p.quietTime, true);
    const sunrise = hm(p.sunrise, 6.52), sunset = hm(p.sunset, 19.72);

    // Pebble Time Steel: 144 x 168 screen, drawn at 3x
    const CX = 72, CY = 84, S = 3;
    const f = (n) => Math.round(n * 100) / 100;
    const rad = (d) => d * Math.PI / 180;
    const toPx = (x, y) => ({ l: f(12 + (x + 24) * S), t: f(8 + (y + 30) * S) });
    // Point where a ray from the centre at angle d meets the screen edge, pulled in by `inset`
    const edgeHit = (inset, d) => {
      const sx = Math.sin(rad(d)), sy = -Math.cos(rad(d));
      const ta = Math.abs(sx) > 1e-9 ? (72 - inset) / Math.abs(sx) : Infinity;
      const tb = Math.abs(sy) > 1e-9 ? (84 - inset) / Math.abs(sy) : Infinity;
      return { x: CX + Math.min(ta, tb) * sx, y: CY + Math.min(ta, tb) * sy, side: ta < tb ? (sx > 0 ? 'r' : 'l') : (sy < 0 ? 't' : 'b') };
    };
    const ray = (inset, d) => { const h = edgeHit(inset, d); return [f(h.x), f(h.y)]; };
    const band = (i1, i2, a, b) => {
      const n = Math.max(2, Math.ceil((b - a) / 1.5));
      const outer = [], inner = [];
      for (let k = 0; k <= n; k++) { const d = a + (b - a) * k / n; outer.push(ray(i1, d)); inner.push(ray(i2, d)); }
      const pts = outer.concat(inner.reverse());
      return 'M' + pts.map((q) => q[0] + ' ' + q[1]).join('L') + 'Z';
    };
    const ticks = (inner, list) => list.map((d) => { const [a, b] = ray(inner, d), [c, e] = ray(-1, d); return 'M' + a + ' ' + b + 'L' + c + ' ' + e; }).join('');
    const angDist = (a, b) => { const d = ((a - b) % 360 + 360) % 360; return Math.min(d, 360 - d); };
    const clock = (h) => String(Math.floor(h) % 24).padStart(2, '0') + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0');

    const now = hour + minute / 60;
    const hA = (now % 12) * 30;
    const mA = minute * 6;
    const clear = (a) => Math.min(angDist(a, hA), angDist(a, mA));

    // Sample calendar (decimal hours; Google Calendar colours mapped to the Pebble 64-colour palette)
    const EVENTS = [
      { s: 15.5, e: 16, c: '#00AAFF', t: 'Standup' },
      { s: 17, e: 18.5, c: '#55AA55', t: 'Design review' },
      { s: 19.25, e: 20, c: '#FF5500', t: 'Dinner' },
      { s: 21.5, e: 22, c: '#AA00AA', t: 'Call' },
      { s: 33, e: 34, c: '#0055AA', t: 'Gym' }
    ];
    const vis = EVENTS.map((e) => ({ ...e, s0: Math.max(e.s, now), e0: Math.min(e.e, now + 12) })).filter((e) => e.e0 > e.s0);
    const ev = [0, 1, 2, 3, 4].map((i) => {
      const e = vis[i];
      if (!e) return { d: '', c: 'none' };
      const a = e.s0 * 30, b = Math.max(a + 1, e.e0 * 30 - 1);
      return { d: band(-1, 6, a, b), c: e.c };
    });
    const nx = vis.find((e) => e.s >= now);
    let nextTri = '', nextC = 'none', sweep = '', chevron = '', nextTime = '', nextIn = '', nextTitle = '';
    if (nx) {
      const a = nx.s * 30, a0 = now * 30;
      const [tx, ty] = ray(6.5, a), [b1x, b1y] = ray(12.5, a - 3), [b2x, b2y] = ray(12.5, a + 3);
      nextTri = 'M' + tx + ' ' + ty + 'L' + b1x + ' ' + b1y + 'L' + b2x + ' ' + b2y + 'Z';
      nextC = nx.c;
      if (a - a0 > 5) {
        sweep = band(7.3, 9, a0 + 2.5, a - 0.5);
        const [c1x, c1y] = ray(6.2, a0), [c2x, c2y] = ray(8.15, a0 + 2.5), [c3x, c3y] = ray(10.1, a0);
        chevron = 'M' + c1x + ' ' + c1y + 'L' + c2x + ' ' + c2y + 'L' + c3x + ' ' + c3y;
      }
      nextTime = clock(nx.s);
      const dm = Math.round((nx.s - now) * 60);
      nextIn = dm < 60 ? 'in ' + dm + 'm' : 'in ' + Math.floor(dm / 60) + 'h ' + (dm % 60) + 'm';
      nextTitle = nx.t;
    }

    const all = Array.from({ length: 60 }, (_, i) => i * 6);
    const minTicks = ticks(3.5, all.filter((d) => d % 30 !== 0));
    const hourTicks = ticks(9, all.filter((d) => d % 30 === 0 && d % 90 !== 0));
    const quarterTicks = ticks(14, [0, 90, 180, 270]);

    // Sunrise / sunset: sun sits flat against whichever screen edge its time lands on; chevron just inside the calendar band
    const rA = (sunrise % 12) * 30, sA = (sunset % 12) * 30;
    const rot = { b: 0, l: 90, t: 180, r: 270 };
    const sunAt = (a) => { const h = edgeHit(2, a), c = edgeHit(10.5, a); return { p: toPx(h.x, h.y), c: toPx(c.x, c.y), rot: rot[h.side] }; };
    const sr = sunAt(rA), ss = sunAt(sA);

    // Dodge: 8 slots on an ellipse that fits the tall screen
    const slotXY = (a, k) => [CX + 38 * k * Math.sin(rad(a)), CY - 47 * k * Math.cos(rad(a))];
    const cands = [0, 45, 90, 135, 180, 225, 270, 315].map((a) => ({ a, s: clear(a) + (a % 90 === 0 ? 8 : 0) }));
    const sorted = [...cands].sort((x, y) => y.s - x.s);
    const s1 = sorted[0];
    const s2 = sorted.find((c) => angDist(c.a, s1.a) >= 90) || sorted[1];
    const [dx, dy] = slotXY(s1.a, 1), [cx, cy] = slotXY(s2.a, 1);

    // Battery ring under the hands; number orbits inside it away from both hands
    let best = 0, bestS = -1;
    for (let a = 0; a < 360; a += 5) { const s = clear(a); if (s > bestS) { bestS = s; best = a; } }
    const Cc = 2 * Math.PI * 17;
    const batC = battery <= 15 ? '#FF5555' : battery <= 30 ? '#FFAA00' : '#55AA55';

    // Physical hands: tapered, running through the centre into a short tail
    const hand = (ang, tail, len, wBase, wTip) => {
      const cs = Math.cos(rad(ang)), sn = Math.sin(rad(ang));
      const P = (r, w) => f(CX + r * sn + w * cs) + ' ' + f(CY - r * cs + w * sn);
      return 'M' + P(-tail, -wBase * 0.35) + 'L' + P(0, -wBase / 2) + 'L' + P(len, -wTip / 2) + 'L' + P(len + wTip * 0.6, 0) + 'L' + P(len, wTip / 2) + 'L' + P(0, wBase / 2) + 'L' + P(-tail, wBase * 0.35) + 'Z';
    };
    // Hand reach: fixed lengths, or stretch each hand to stop just inside the hour marks wherever it points
    const edgeDist = (d) => { const h = edgeHit(0, d); return Math.hypot(h.x - CX, h.y - CY); };
    const stretch = p.handReach === 'stretch';
    const mnLen = stretch ? edgeDist(mA) - 11 : 64;
    const hrLen = stretch ? (edgeDist(hA) - 11) * 0.64 : 42;
    const th = p.theme === 'teal'
      ? { dial: '#005555', tick: '#FFFFAA', minTick: '#55AAAA', track: '#000000', shadow: '#000000' }
      : { dial: '#000000', tick: '#FFFFFF', minTick: '#555555', track: '#555555', shadow: '#000000' };

    return {
      accent: p.accent ?? '#FFAA00',
      weekday: p.weekday ?? 'WED',
      day: p.day ?? 14,
      battery, batC, batDash: f(Cc * battery / 100) + ' ' + f(Cc),
      batNum: toPx(CX + 9.5 * Math.sin(rad(best)), CY - 9.5 * Math.cos(rad(best))),
      ev0: ev[0], ev1: ev[1], ev2: ev[2], ev3: ev[3], ev4: ev[4],
      sweep, chevron, nextTri, nextC, nextTime, nextIn, nextTitle, hasNext: !!nx,
      minTicks, hourTicks, quarterTicks,
      riseP: sr.p, riseC: sr.c, riseRot: sr.rot, setP: ss.p, setC: ss.c, setRot: ss.rot,
      date: toPx(dx, dy), card: toPx(cx, cy),
      btOff, quiet,
      // Hands never reach the corners of a rectangular screen, so status icons live there
      bt: toPx(13, 15), qt: toPx(131, 15),
      hrPath: hand(hA, 11, hrLen, 6.5, 3.6), mnPath: hand(mA, 15, mnLen, 5, 2.5),
      th
    };
  }
}
</script>
